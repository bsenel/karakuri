# Pre-commit hooks — the first DevSecOps gate, run locally before a commit lands.
# Install once with: pip install pre-commit && pre-commit install
# See docs/audit/CI_SECURITY_PIPELINE.md (Matrix E, pre-commit stage).
#
# These are fast, local checks. The heavier scans (SCA, container, SBOM) run in
# CI, not here, so committing stays quick.

repos:
  # Hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^web/(dist|node_modules)/'
      - id: end-of-file-fixer
        exclude: '^web/(dist|node_modules)/'
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key

  # Secret scanning — the same tool CI runs, caught before the secret is committed.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Go: format, vet, and the architectural-boundary check.
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]
        pass_filenames: true
      - id: go-vet
        name: go vet
        entry: bash -c 'go vet ./...'
        language: system
        types: [go]
        pass_filenames: false
      - id: langchaingo-boundary
        name: langchaingo import boundary (AGENTS.md, ADR 001)
        entry: scripts/check_langchaingo_imports.sh
        language: script
        types: [go]
        pass_filenames: false
