services:
  karakuri:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - karakuri-data:/data
    environment:
      # Required: the JWT signing key. `openssl rand -base64 32` will do.
      - KARAKURI_AUTH_JWT_SECRET=${KARAKURI_AUTH_JWT_SECRET:-}
      # Required on first boot: the password for the administrator created on
      # a database with no principals.
      - KARAKURI_AUTH_BOOTSTRAP_PASSWORD=${KARAKURI_AUTH_BOOTSTRAP_PASSWORD:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  karakuri-data:
