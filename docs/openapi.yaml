components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: karakuri_access
  schemas:
    Artifact:
      type: object
      properties:
        sha:
          type: string
        objective_id:
          type: string
        agent_id:
          type: string
        capability:
          type: string
        content_type:
          type: string
        size:
          type: integer
        created_at:
          type: string
          format: date-time
    AuditEvent:
      type: object
      properties:
        id:
          type: string
        objective_id:
          type: string
        agent_id:
          type: string
        capability:
          type: string
        adapter:
          type: string
        success:
          type: boolean
        confidence:
          type: number
        payload_json:
          type: string
        kind:
          type: string
        escalation_reason:
          type: string
        approver:
          type: string
        bounds_violation:
          type: boolean
        provider:
          type: string
        model:
          type: string
        template_id:
          type: string
        autonomy_rung:
          type: string
        created_at:
          type: string
          format: date-time
    AuthDecision:
      type: object
      properties:
        allowed:
          type: boolean
        effect:
          type: string
        principal_id:
          type: string
        action:
          type: string
        resource:
          type: string
        matched_policy:
          type: string
        via_role:
          type: string
        binding_scope:
          type: string
        conditions:
          type: array
          items:
            type: object
            properties:
              condition:
                type: object
                properties:
                  kind:
                    type: string
                  key:
                    type: string
                  values:
                    type: array
                    items:
                      type: string
              satisfied:
                type: boolean
              detail:
                type: string
        reason:
          type: string
        considered_roles:
          type: array
          items:
            type: string
    Autonomy:
      type: object
      properties:
        level:
          type: string
        ceiling:
          type: string
        promote_after:
          type: integer
        demote_on_failure:
          type: boolean
    Budget:
      type: object
      properties:
        daily:
          type: number
        per_reconcile:
          type: number
    Cadence:
      type: object
      properties:
        sense:
          type: string
        every:
          type: string
        cron:
          type: string
        daily_at:
          type: string
        timezone:
          type: string
        resync:
          type: string
        min_interval:
          type: string
        quiet:
          type: array
          items:
            type: string
    CalibrationReport:
      type: object
      properties:
        TwinID:
          type: string
        Since:
          type: string
          format: date-time
        Until:
          type: string
          format: date-time
        N:
          type: integer
        Agreed:
          type: integer
        Skipped:
          type: integer
        Agreement:
          type: number
        Replayable:
          type: integer
        Confusion:
          type: object
          properties:
            JudgePassHumanApprove:
              type: integer
            JudgePassHumanReject:
              type: integer
            JudgeFailHumanApprove:
              type: integer
            JudgeFailHumanReject:
              type: integer
        ByDecision:
          type: object
          additionalProperties:
            type: object
            properties:
              N:
                type: integer
              Agreed:
                type: integer
              JudgePass:
                type: integer
        Items:
          type: array
          items:
            type: object
            properties:
              CheckpointID:
                type: string
              ObjectiveID:
                type: string
              Choice:
                type: string
              HumanApprove:
                type: boolean
              JudgePass:
                type: boolean
              Agreed:
                type: boolean
              Reply:
                type: string
              Error:
                type: string
              Title:
                type: string
              Criterion:
                type: string
              Actions:
                type: string
    Capability:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        domain:
          type: string
        description:
          type: string
        input_schema:
          type: object
          properties:
            type:
              type: string
            properties:
              type: object
              additionalProperties:
                type: object
                properties:
                  type:
                    type: string
                  description:
                    type: string
                  enum:
                    type: array
                    items:
                      type: string
            required:
              type: array
              items:
                type: string
        output_schema:
          type: object
          properties:
            type:
              type: string
            properties:
              type: object
              additionalProperties:
                type: object
                properties:
                  type:
                    type: string
                  description:
                    type: string
                  enum:
                    type: array
                    items:
                      type: string
            required:
              type: array
              items:
                type: string
        verifiable:
          type: boolean
        llm_hints:
          type: object
          properties:
            preferred_provider:
              type: string
            fallback_provider:
              type: string
            temperature_min:
              type: number
            temperature_max:
              type: number
        needs_workspace:
          type: boolean
    Checkpoint:
      type: object
      properties:
        id:
          type: string
        objective_id:
          type: string
        twin_id:
          type: string
        reason:
          type: string
        summary:
          type: string
        options:
          type: array
          items:
            type: string
        capability:
          type: string
        confidence:
          type: number
        actions:
          type: array
          items:
            type: object
            properties:
              capability:
                type: string
              params:
                type: object
                additionalProperties: {}
              reason:
                type: string
              env_id:
                type: string
        audit_event_id:
          type: string
        status:
          type: string
        decision:
          type: object
          properties:
            choice:
              type: string
            note:
              type: string
            approver:
              type: string
            modifications:
              $ref: '#/components/schemas/CheckpointModifications'
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    CheckpointModifications:
      type: object
      properties:
        removed_actions:
          type: array
          items:
            type: string
        added_constraints:
          type: array
          items:
            type: string
        revised_confidence:
          type: number
    ConformanceResult:
      type: object
      properties:
        check:
          type: string
        passed:
          type: boolean
        message:
          type: string
        warning:
          type: boolean
    Constraint:
      type: object
      properties:
        id:
          type: string
        description:
          type: string
        hard:
          type: boolean
        expression:
          type: string
    Container:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
        name:
          type: string
        parent_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CostBucket:
      type: object
      properties:
        key:
          type: array
          items:
            type: string
        units:
          type: number
        cost:
          type: number
        events:
          type: integer
    Criterion:
      type: object
      properties:
        id:
          type: string
        description:
          type: string
        verifier:
          type: string
        threshold: {}
        weight:
          type: number
        met:
          type: boolean
        domain:
          type: string
    Digest:
      type: object
      properties:
        twin_id:
          type: string
        twin_name:
          type: string
        since:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
        objectives:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              title:
                type: string
              status:
                type: string
              senses:
                type: integer
              reconciles:
                type: integer
              drift_detected:
                type: integer
              converged:
                type: integer
              escalations:
                type: integer
              failures:
                type: integer
              actions:
                type: integer
              autonomy:
                type: string
              criteria_met:
                type: number
              paused:
                type: boolean
              paused_why:
                type: string
              last_error:
                type: string
        decisions:
          type: array
          items:
            type: object
            properties:
              checkpoint_id:
                type: string
              objective_id:
                type: string
              objective_title:
                type: string
              reason:
                type: string
