openapi: 3.0.3
info:
  title: Karakuri API
  version: '1'
  description: 'The Karakuri server''s REST API. Every route the server mounts under /api/v1 is listed
    here, and test/integration/openapi_routes_test.go fails when a route is missing or a listed one no
    longer exists. x-karakuri-permission names the permission an operation requires; routes without it
    need only an authenticated principal, and public routes set `security: []`. Request bodies are JSON
    unless stated.'
servers:
- url: /api/v1
security:
- bearerAuth: []
- cookieAuth: []
tags:
- name: artifacts
- name: audit
- name: auth
- name: checkpoints
- name: containers
- name: domains
- name: eval
- name: events
- name: health
- name: loops
- name: mcp
- name: memory
- name: objectives
- name: quota
- name: reconcile
- name: reports
- name: research
- name: twins
paths:
  /artifacts:
    get:
      operationId: listArtifacts
      tags:
      - artifacts
      summary: List artifacts
      x-karakuri-permission: artifact:read
      parameters:
      - name: objective_id
        in: query
        required: false
        description: Filter by objective.
        schema:
          type: string
      - name: agent_id
        in: query
        required: false
        description: Filter by agent.
        schema:
          type: string
      responses:
        '200':
          description: Artifacts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Artifact'
        '401':
          description: Missing or invalid credential.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: The principal lacks the permission.
          content:
            text/plain:
              schema:
                type: string
        '429':
          description: Over the caller's rate or quota limit.
          content:
            text/plain:
              schema:
                type: string
    post:
      operationId: writeArtifact
      tags:
      - artifacts
      summary: Store content as a content-addressed artifact
      x-karakuri-permission: artifact:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                objective_id:
                  type: string
                agent_id:
                  type: string
                capability:
                  type: string
                content:
                  type: string
              required:
              - content
      responses:
        '200':
          description: The artifact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        '400':
          description: 'Bad request: the body or a parameter could not be read.'
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Missing or invalid credential.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: The principal lacks the permission.
          content:
            text/plain:
              schema:
                type: string
        '429':
          description: Over the caller's rate or quota limit.
          content:
            text/plain:
              schema:
                type: string
  /artifacts/{sha}:
    get:
      operationId: getArtifact
      tags:
      - artifacts
      summary: Download an artifact's content (always as an attachment)
      x-karakuri-permission: artifact:read
      parameters:
      - name: sha
        in: path
        required: true
        description: Content SHA.
        schema:
          type: string
      responses:
        '200':
          description: The raw content.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: Missing or invalid credential.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: The principal lacks the permission.
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: No such resource.
          content:
            text/plain:
              schema:
                type: string
        '429':
          description: Over the caller's rate or quota limit.
          content:
            text/plain:
              schema:
                type: string
  /artifacts/{sha}/diff/{other}:
    get:
      operationId: diffArtifacts
      tags:
      - artifacts
      summary: Diff two artifacts
      x-karakuri-permission: artifact:read
      parameters:
      - name: sha
        in: path
        required: true
        description: Content SHA.
        schema:
          type: string
      - name: other
        in: path
        required: true
        description: The other content SHA.
        schema:
          type: string
      responses:
        '200':
          description: A unified diff.
          content:
            application/json:
              schema:
                type: object
                properties:
                  diff:
                    type: string
        '401':
          description: Missing or invalid credential.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: The principal lacks the permission.
          content:
            text/plain:
              schema:
                type: string
        '429':
          description: Over the caller's rate or quota limit.
          content:
            text/plain:
              schema:
                type: string
  /audit:
    get:
      operationId: listAuditEvents
      tags:
      - audit
      summary: List audit events
      x-karakuri-permission: audit:read
      parameters:
      - name: objective_id
        in: query
        required: false
        description: Filter by objective.
        schema:
          type: string
      - name: agent_id
        in: query
        required: false
        description: Filter by agent.
        schema:
          type: string
      - name: kind
        in: query
        required: false
        description: Filter by event kind.
        schema:
          type: string
      - name: provider
        in: query
        required: false
        description: Filter by model provider.
        schema:
          type: string
      - name: model
        in: query
        required: false
        description: Filter by model.
        schema:
          type: string
      - name: template
        in: query
        required: false
        description: Filter by objective template.
        schema:
          type: string
      - name: bounds_violation
        in: query
        required: false
        description: Only authority-bounds violations.
        schema:
          type: boolean
      - name: since
        in: query
        required: false
        description: Only events after this, RFC 3339 or a duration.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Maximum events.
        schema:
          type: integer
      responses:
        '200':
          description: Audit events.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
        '401':
          description: Missing or invalid credential.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: The principal lacks the permission.
          content:
            text/plain:
              schema:
                type: string
        '429':
          description: Over the caller's rate or quota limit.
          content:
            text/plain:
              schema:
                type: string
  /audit/export:
    get:
      operationId: exportAuditWindow
      tags:
      - audit
      summary: Export an audit window as a reproducible document
      x-karakuri-permission: audit:read
      parameters:
      - name: from
        in: query
        required: false
        description: Window start, RFC 3339.
        schema:
          type: string
      - name: to
        in: query
        required: false
        description: Window end, RFC 3339.
        schema:
          type: string
      responses:
        '200':
          description: The export.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: 'Bad request: the body or a parameter could not be read.'
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Missing or invalid credential.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: The principal lacks the permission.
          content:
            text/plain:
              schema:
                type: string
        '429':
          description: Over the caller's rate or quota limit.
          content:
            text/plain:
              schema:
                type: string
  /audit/{id}:
    get:
      operationId: getAuditEvent
      tags:
      - audit
      summary: Get an audit event
      x-karakuri-permission: audit:read
      parameters:
      - name: id
        in: path
        required: true
        description: Resource ID.
        schema:
          type: string
      responses:
        '200':
          description: The event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEvent'
        '401':
          description: Missing or invalid credential.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: The principal lacks the permission.
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: No such resource.
          content:
            text/plain:
              schema:
                type: string
        '429':
          description: Over the caller's rate or quota limit.
          content:
            text/plain:
              schema:
                type: string
  /auth/bindings:
    get:
      operationId: listBindings
      tags:
      - auth
      summary: List role bindings
      x-karakuri-permission: auth:read
      parameters:
      - name: principal
        in: query
        required: false
        description: Only this principal's bindings.
        schema:
          type: string
      responses:
        '200':
          description: Role bindings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleBinding'
        '401':
          description: Missing or invalid credential.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: The principal lacks the permission.
          content:
            text/plain:
              schema:
                type: string
        '429':
          description: Over the caller's rate or quota limit.
          content:
            text/plain:
              schema:
                type: string
    post:
      operationId: createBinding
      tags:
      - auth
      summary: Bind a role to a principal at a scope
      x-karakuri-permission: auth:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                principal_id:
                  type: string
                role:
                  type: string
                scope:
                  type: string
              required:
              - principal_id
              - role
      responses:
        '201':
          description: The binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleBinding'
        '400':
          description: 'Bad request: the body or a parameter could not be read.'
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Missing or invalid credential.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: The principal lacks the permission.
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: No such resource.
          content:
            text/plain:
              schema:
                type: string
        '429':
          description: Over the caller's rate or quota limit.
          content:
            text/plain:
              schema:
                type: string
  /auth/bindings/{id}:
    delete:
      operationId: deleteBinding
      tags:
      - auth
      summary: Delete a role binding
      x-karakuri-permission: auth:write
      parameters:
      - name: id
        in: path
        required: true
        description: Resource ID.
        schema:
          type: string
      responses:
        '204':
          description: Deleted.
        '401':
          description: Missing or invalid credential.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: The principal lacks the permission.
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: No such resource.
          content:
            text/plain:
              schema:
                type: string
        '429':
          description: Over the caller's rate or quota limit.
          content:
            text/plain:
              schema:
                type: string
  /auth/catalog:
    get:
      operationId: listPermissionCatalog
      tags:
      - auth
      summary: List every permission and what it allows
      x-karakuri-permission: auth:read
      responses:
        '200':
          description: The permission catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '401':
          description: Missing or invalid credential.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: The principal lacks the permission.
          content:
            text/plain:
              schema:
                type: string
        '429':
          description: Over the caller's rate or quota limit.
          content:
            text/plain:
              schema:
                type: string
  /auth/check:
    post:
      operationId: checkPermission
      tags:
      - auth
      summary: Ask whether a principal may perform an action on a resource
      x-karakuri-permission: auth:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                principal:
                  type: string
                action:
                  type: string
                resource:
                  type: string
                owner:
                  type: string
              required:
              - principal
              - action
      responses:
        '200':
          description: The decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthDecision'
        '400':
          description: 'Bad request: the body or a parameter could not be read.'
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Missing or invalid credential.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: The principal lacks the permission.
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: No such resource.
          content:
            text/plain:
              schema:
                type: string
        '429':
          description: Over the caller's rate or quota limit.
          content:
            text/plain:
              schema:
                type: string
  /auth/me:
    get:
      operationId: getMe
      tags:
      - auth
      summary: The calling principal, its roles, bindings and permissions
      responses:
        '200':
          description: The caller's identity and grants.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Missing or invalid credential.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: The principal lacks the permission.
          content:
            text/plain:
              schema:
                type: string
        '429':
          description: Over the caller's rate or quota limit.
          content:
            text/plain:
              schema:
                type: string
  /auth/policies:
    get:
      operationId: listPolicies
      tags:
      - auth
      summary: List grants, for one principal or per role
      x-karakuri-permission: auth:read
      parameters:
      - name: principal
        in: query
        required: false
        description: Expand this principal's grants.
        schema:
          type: string
      responses:
        '200':
          description: Grants.
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/Grant'
                - type: object
                  additionalProperties: true
        '401':
          description: Missing or invalid credential.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: The principal lacks the permission.
          content:
            text/plain:
              schema:
                type: string
        '429':
          description: Over the caller's rate or quota limit.
          content:
            text/plain:
              schema:
                type: string
  /auth/refresh:
    post:
      operationId: refreshToken
      tags:
      - auth
      summary: Exchange a refresh token for a new pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Omit when the refresh token is in a cookie.
      responses:
        '200':
          description: A new token pair.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/TokenPair'
                - $ref: '#/components/schemas/SessionResponse'
        '400':
          description: 'Bad request: the body or a parameter could not be read.'
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Missing or invalid credential.
          content:
            text/plain:
              schema:
                type: string
        '429':
          description: Over the caller's rate or quota limit.
          content:
            text/plain:
              schema:
                type: string
  /auth/revoke:
    post:
      operationId: revokeToken
      tags:
      - auth
      summary: Revoke a refresh token (end a session)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Omit when it is in a cookie.
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '401':
          description: Missing or invalid credential.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: The principal lacks the permission.
          content:
            text/plain:
              schema:
                type: string
        '429':
          description: Over the caller's rate or quota limit.
          content:
            text/plain:
              schema:
                type: string
  /auth/roles:
    get:
      operationId: listRoles
      tags:
      - auth
      summary: List roles
      x-karakuri-permission: auth:read
      responses:
        '200':
          description: Roles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '401':
          description: Missing or invalid credential.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: The principal lacks the permission.
          content:
            text/plain:
              schema:
                type: string
        '429':
          description: Over the caller's rate or quota limit.
          content:
            text/plain:
              schema:
                type: string
  /auth/saml/acs:
    post:
      operationId: samlACS
      tags:
      - auth
      summary: SAML assertion consumer service
      security: []
      responses:
        '302':
          description: Redirect with the session established.
        '400':
          description: 'Bad request: the body or a parameter could not be read.'
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Missing or invalid credential.
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: No such resource.
          content:
            text/plain:
              schema:
                type: string
  /auth/saml/metadata:
    get:
      operationId: getSAMLMetadata
      tags:
      - auth
      summary: This service provider's SAML metadata
      security: []
      responses:
        '200':
          description: SAML SP metadata.
          content:
            application/samlmetadata+xml:
              schema:
                type: string
        '404':
          description: No such resource.
          content:
            text/plain:
              schema:
                type: string
  /auth/sso/callback:
    get:
      operationId: finishSSOLogin
      tags:
      - auth
      summary: OIDC callback (redirects back to the SPA or the CLI)
      security: []
      responses:
        '302':
          description: Redirect with the session established, or with a one-time code for the CLI.
        '400':
          description: 'Bad request: the body or a parameter could not be read.'
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Missing or invalid credential.
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: No such resource.
          content:
            text/plain:
              schema:
                type: string
  /auth/sso/config:
    get:
      operationId: getSSOConfig
      tags:
      - auth
      summary: Describe the configured federated login, if any
      security: []
      responses:
        '200':
          description: The provider kind and login URL.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /auth/sso/exchange:
    post:
      operationId: exchangeSSOCode
      tags:
      - auth
      summary: Exchange a CLI login's one-time code and PKCE verifier for tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                verifier:
                  type: string
              required:
              - code
              - verifier
      responses:
        '200':
          description: A token pair.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: 'Bad request: the body or a parameter could not be read.'
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Missing or invalid credential.
          content:
            text/plain:
              schema:
                type: string
  /auth/sso/login:
    get:
      operationId: startSSOLogin
      tags:
      - auth
      summary: Start a federated login (redirects to the identity provider)
      security: []
      parameters:
      - name: port
        in: query
        required: false
        description: Loopback port of a CLI login.
        schema:
          type: string
      - name: challenge
        in: query
        required: false
        description: PKCE challenge of a CLI login.
        schema:
          type: string
      responses:
        '302':
          description: Redirect to the identity provider.
        '400':
          description: 'Bad request: the body or a parameter could not be read.'
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: No such resource.
          content:
            text/plain:
              schema:
                type: string
  /auth/token:
    post:
      operationId: issueToken
      tags:
      - auth
      summary: Exchange an ID and password for a token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                password:
                  type: string
                cookie:
                  type: boolean
                  description: Set the tokens as cookies instead of returning them.
              required:
              - id
              - password
      responses:
        '200':
          description: A token pair, or the session shape when cookie is set.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/TokenPair'
                - $ref: '#/components/schemas/SessionResponse'
        '400':
          description: 'Bad request: the body or a parameter could not be read.'
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Missing or invalid credential.
          content:
            text/plain:
              schema:
                type: string
        '429':
          description: Over the caller's rate or quota limit.
          content:
            text/plain:
              schema:
                type: string
  /auth/users:
    get:
      operationId: listUsers
      tags:
      - auth
      summary: List principals
      x-karakuri-permission: auth:read
      responses:
        '200':
          description: Principals.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Principal'
        '401':
          description: Missing or invalid credential.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: The principal lacks the permission.
          content:
            text/plain:
              schema:
                type: string
        '429':
          description: Over the caller's rate or quota limit.
          content:
            text/plain:
              schema:
                type: string
    post:
      operationId: createUser
      tags:
      - auth
      summary: Create a principal, its role bindings, and for a service account its tokens
      x-karakuri-permission: auth:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                roles:
                  type: array
                  items:
                    type: string
                scope:
                  type: string
                password:
                  type: string
                service_account:
                  type: boolean
                attrs:
                  type: object
                  additionalProperties:
                    type: string
              required:
              - id
      responses:
        '201':
          description: The created principal.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: 'Bad request: the body or a parameter could not be read.'
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Missing or invalid credential.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: The principal lacks the permission.
