    Criterion:
      additionalProperties: false
      properties:
        description:
          type: string
        domain:
          type: string
        evidence:
          description: What the judge will look at; a judged criterion without it is refused at create time.
          type: string
        id:
          type: string
        baseline:
          description: What a relative target is measured against, "at_start" or a number fixed by hand.
          nullable: true
          oneOf:
          - enum:
            - at_start
            type: string
          - type: number
        baseline_value:
          description: The frozen baseline; the number itself when one was given, absent for at_start until it has been measured.
          nullable: true
          type: number
        change:
          description: How the measured value is set against the baseline (absolute or percent); with no baseline value the criterion is inconclusive (no_baseline).
          type: string
        k:
          description: Under the k_of_n reducer, how many samples must meet the target.
          type: integer
        kind:
          description: What settles the criterion (judged, verified or measured).
          type: string
        met:
          description: Derived from state; true only when state is met.
          type: boolean
        metric:
          description: The verifier measurement a measured criterion compares.
          type: string
        min_samples:
          description: Below this many samples the criterion is inconclusive (too_few_samples).
          type: integer
        op:
          description: How a measured value is compared with the target (<, <=, >, >= or ==).
          type: string
        params:
          additionalProperties: {}
          description: Values for the parameters the metric declares; an undeclared name is refused at create time.
          nullable: true
          type: object
        reason:
          description: Why the criterion is inconclusive, when it is.
          type: string
        reducer:
          description: How the samples become one state (all, k_of_n, median, p95, min, max or mean).
          type: string
        required:
          description: Whether the criterion gates completion; null is required.
          nullable: true
          type: boolean
        samples:
          description: How many measurements of the metric a measured criterion takes.
          type: integer
        state:
          description: What the last verify step settled (met, not_met or inconclusive).
          type: string
        sustain:
          additionalProperties: false
          description: How a standing objective's criterion holds over time, a not_met budget over a rolling window that reconcile reads; absent is no sustain.
          nullable: true
          properties:
            budget:
              description: The share of settled passes in the window that may end not_met, 0 to 1.
              type: number
            min_passes:
              description: Below this many settled passes in the window the sustain state is inconclusive (too_few_samples).
              type: integer
            window:
              description: The rolling window, days such as 28d or a duration such as 72h; never a calendar period.
              type: string
          type: object
        target:
          description: The value a measured criterion is compared with.
          nullable: true
          type: number
        threshold: {}
        unit:
          description: The unit of the target; it must equal the unit the verifier declares.
          type: string
        verifier:
          type: string
        weight:
          type: number
      type: object
    CriterionRequest:
      description: A success criterion as a create request sends it; what settles it (state, reason, met) is the server's to write.
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        description:
          type: string
        kind:
          description: judged, verified or measured.
          type: string
        evidence:
          description: What the judge will look at; required for a judged criterion.
          type: string
        verifier:
          description: A registered verifying capability; required for a verified or measured criterion.
          type: string
        domain:
          type: string
        weight:
          type: number
        threshold: {}
        required:
          description: Whether the criterion gates completion; null or absent is required.
          nullable: true
          type: boolean
        metric:
          description: A metric the verifier declares.
          type: string
        op:
          description: <, <=, >, >= or ==.
          type: string
        target:
          nullable: true
          type: number
        unit:
          description: Must equal the unit the verifier declares for the metric.
          type: string
        params:
          additionalProperties: {}
          description: Values for parameters the metric declares.
          nullable: true
          type: object
        samples:
          description: How many measurements a measured criterion takes; not negative.
          type: integer
        reducer:
          description: all, k_of_n, median, p95, min, max or mean; a measured criterion only.
          type: string
        k:
          description: Under k_of_n, how many samples must meet the target; 1 to samples.
          type: integer
        min_samples:
          description: Below this many samples the criterion is inconclusive; at most samples.
          type: integer
        baseline:
          description: '"at_start" or a number fixed by hand; a measured criterion only, and required with change.'
          nullable: true
          oneOf:
          - enum:
            - at_start
            type: string
          - type: number
        change:
          description: absolute or percent; a measured criterion only, and needs a baseline.
          type: string
        sustain:
          description: A not_met budget over a rolling window, read by reconcile; a request may not loosen a template's.
          nullable: true
          type: object
          additionalProperties: false
          properties:
            window:
              description: Days such as 28d or a duration such as 72h; positive.
              type: string
            budget:
              description: The share of settled passes in the window that may end not_met; 0 to 1.
              type: number
            min_passes:
              description: Below this many settled passes the sustain state is inconclusive; not negative.
              type: integer
      required:
      - id
      - description
      - kind
