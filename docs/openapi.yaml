    cookieAuth:
      type: apiKey
      in: cookie
      name: karakuri_access
  schemas:
    AdapterStatus:
      additionalProperties: false
      properties:
        active:
          type: boolean
        instance:
          type: string
        is_default:
          type: boolean
        slot:
          type: string
        type:
          type: string
      type: object
    Artifact:
      additionalProperties: false
      properties:
        agent_id:
          type: string
        capability:
          type: string
        content_type:
          type: string
        created_at:
          format: date-time
          type: string
        objective_id:
          type: string
        sha:
          type: string
        size:
          type: integer
      type: object
    AuditEvent:
      additionalProperties: false
      properties:
        adapter:
          type: string
        agent_id:
          type: string
        approver:
          type: string
        autonomy_rung:
          type: string
        bounds_violation:
          type: boolean
        capability:
          type: string
        confidence:
          type: number
        created_at:
          format: date-time
          type: string
        escalation_reason:
          type: string
        id:
          type: string
        kind:
          type: string
        model:
          type: string
        objective_id:
          type: string
        payload_json:
          type: string
        provider:
          type: string
        success:
          type: boolean
        template_id:
          type: string
      type: object
    AuditExport:
      additionalProperties: false
      properties:
        autonomy_changes:
          items:
            additionalProperties: false
            properties:
              adapter:
                type: string
              agent_definition_id:
                type: string
              agent_id:
                type: string
              approver:
                type: string
              autonomy_rung:
                type: string
              bounds:
                additionalProperties: false
                nullable: true
                properties:
                  confidence_threshold:
                    type: number
                  effective_threshold:
                    type: number
                  max_autonomous:
                    type: integer
                  requires_approval_for:
                    items:
                      type: string
                    nullable: true
                    type: array
                type: object
              bounds_violation:
                type: boolean
              capability:
                type: string
              checkpoint_id:
                type: string
              confidence:
                type: number
              created_at:
                type: string
              escalation_reason:
                type: string
              id:
                type: string
              kind:
                type: string
              model:
                type: string
              modifications: {}
              objective_id:
                type: string
              payload: {}
              provider:
                type: string
              reasoning_strategy:
                type: string
              risk_class:
                type: string
              success:
                type: boolean
              template_id:
                type: string
            type: object
          nullable: true
          type: array
        counts_by_kind:
          items:
            additionalProperties: false
            properties:
              count:
                type: integer
              kind:
                type: string
            type: object
          nullable: true
          type: array
        decisions:
          additionalProperties: false
          properties:
            rows:
              items:
                additionalProperties: false
                properties:
                  adapter:
                    type: string
                  agent_definition_id:
                    type: string
                  agent_id:
                    type: string
                  approver:
                    type: string
                  autonomy_rung:
                    type: string
                  bounds:
                    additionalProperties: false
                    nullable: true
                    properties:
