name: CI

# Gates branch protection on main: every PR must pass build + vet + test before
# it can be merged. Runs on push to main as well so the default branch always
# has a green status badge.

on:
  pull_request:
    # Stacked PRs target their parent branch rather than main, so the filter has
    # to include them or an intermediate PR sits with no checks at all until it
    # is retargeted — which is the point at which review is already over.
    branches: [main, "claude/**"]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Which of the jobs below are worth running for this diff.
  #
  # Every job here carries `if: needs.changes.outputs.code == 'true'` rather
  # than this workflow carrying a top-level `paths:` key, and the difference is
  # load-bearing: a workflow skipped by a path filter never creates its checks,
  # and branch protection waits for them forever. A job skipped by an `if:`
  # reports success. See .github/actions/changed-paths for the full reasoning
  # and the classification rules.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        uses: ./.github/actions/changed-paths

  # The Go binary embeds the React SPA via //go:embed all:dist (web/embed.go).
  # web/dist/ is gitignored, so CI must build the frontend before any Go
  # target compiles. We do it once here and share the result with the three
  # Go jobs below via an artifact.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      # Unit tests only. The Playwright suite needs a browser and a running
      # server, so it is its own job below rather than a step that makes every
      # frontend build wait for a browser download.
      - run: npm run test
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1
          if-no-files-found: error

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [changes, frontend]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - run: go build ./...

  vet:
    name: Vet
    runs-on: ubuntu-latest
    needs: [changes, frontend]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - run: go vet ./...

  # The standalone auth and quota modules live in their own go.mod files, so
  # the root `go build ./...` above never sees them. They also have no frontend
  # dependency, so this job runs in parallel with `frontend` rather than after
  # it. Coverage is gated because these are enforcement boundaries: a limiter
  # or an authorizer with an untested branch is one that fails open somewhere
  # nobody looked.
  modules:
    name: Modules
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # quota/valkey's tests need a real server: the algorithms live in Lua, so
    # the only way to know they behave like the Go ones is to run them. The
    # container is cheap and shared across the matrix rather than split into a
    # job of its own; the other modules simply ignore VALKEY_ADDR.
    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      VALKEY_ADDR: localhost:6379
    strategy:
      fail-fast: false
      matrix:
        include:
          # The core modules are pure logic, so every branch is reachable from
          # a test and the bar is set accordingly.
          - module: auth
            coverage: 95
          - module: quota
            coverage: 95
          # quota/cost is pure arithmetic over its own types, like the two
          # above, and its residue is one unreachable default branch guarded by
          # Query.Validate.
          - module: quota/cost
            coverage: 95
          # auth/sql's residual uncovered statements are RowsAffected() and
          # tx.Commit() error branches, which need a fault-injecting driver to
          # reach. Behaviour is covered — every method against a closed
          # database, corrupt JSON columns, and contention on a single refresh
          # token — so the bar reflects the plumbing rather than being padded
          # with a driver stub nobody would maintain.
          - module: auth/sql
            coverage: 90
          # quota/sql's residue is the same shape: exec error branches inside a
          # transaction, reachable only by breaking the schema mid-flight.
          # Behaviour is covered against a real SQLite file, including the full
          # shared contract, a drifted schema, and every method against a closed
          # database.
          - module: quota/sql
            coverage: 90
          # quota/valkey reimplements the algorithms in Lua — unavoidably, since
          # the point is that they run server-side — so it runs the same shared
          # contract against the service container below. Its residue is reply
          # shapes no real client produces.
          - module: quota/valkey
            coverage: 90
          # quota/cost/sql's residue is the Postgres transaction path and exec
          # error branches inside a transaction, the same shape quota/sql's is.
          # Behaviour is covered against a real SQLite file: the full shared
          # contract, a drifted schema, a cancelled context, and every method
          # against a closed database.
          - module: quota/cost/sql
            coverage: 90
          # auth/oidc drives the full authorization-code flow against an
          # in-process provider, so the residue is crypto/rand failing — which
          # no test can stage without pretending. A live Keycloak covers what a
          # real provider does differently; see the identity job.
          - module: auth/oidc
            coverage: 90
          # auth/saml drives a real crewjam/saml IdentityProvider, so signatures
          # and audiences are genuinely produced and verified rather than
          # asserted. Its residue is the library erroring where the library does
          # not error.
          - module: auth/saml
            coverage: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          # The core modules have no external dependencies, so there is no
          # go.sum for setup-go's cache key to hash.
          cache: false
      # Nested modules resolve their parent through a replace directive until
      # the parent is tagged, so they build straight from the working tree.
      - run: go build ./...
        working-directory: ${{ matrix.module }}
      - run: go vet ./...
        working-directory: ${{ matrix.module }}
      - run: go test ./... -race -count=1
        working-directory: ${{ matrix.module }}
      - name: Coverage gate
        working-directory: ${{ matrix.module }}
        env:
          MIN_COVERAGE: ${{ matrix.coverage }}
        run: |
          set -euo pipefail
          # Two kinds of package are documentation rather than library surface,
          # and neither is measured here. Runnable examples are exercised by
          # `go vet` and by running them. `quotatest` is the backend contract
          # suite: its uncovered statements are assertion branches that only
          # execute when a backend is broken, and it is executed in full by the
          # package under test. `costtest` is the same thing for ledgers.
          pkgs=$(go list ./... | grep -v -e '/examples/' -e '/quotatest' -e '/costtest')
          go test ${pkgs} -coverprofile=cover.out >/dev/null
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "${{ matrix.module }} coverage: ${total}% (gate: ${MIN_COVERAGE}%)"
          awk -v t="${total}" -v min="${MIN_COVERAGE}" \
            'BEGIN { if (t+0 < min+0) { printf "coverage %s%% is below the %s%% gate\n", t, min; exit 1 } }'

      - name: Example server runs
        if: matrix.module == 'auth'
        working-directory: auth
        run: go run ./examples/server

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [changes, frontend]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - run: go test ./... -race -count=1 -timeout 5m

  # A real identity provider, because the in-process one in the integration
  # suite can only prove Karakuri drives the flow correctly — not that it agrees
  # with an actual provider about discovery documents, JWKS shapes, audiences
  # and where group membership lives, which is where implementations differ.
  #
  # Its own job rather than a service container on `test`: Keycloak takes the
  # better part of a minute to become ready, and making every other test wait
  # for that is a poor trade.
  identity:
    name: Identity provider
    runs-on: ubuntu-latest
    needs: [changes, frontend]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      # Started with `docker run` rather than as a `services:` container: the
      # image's entrypoint needs the `start-dev` argument, and service
      # containers have no way to pass one.
      - name: Start Keycloak
        run: |
          docker run -d --name keycloak -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            quay.io/keycloak/keycloak:26.0 start-dev

      # The image ships no curl, so readiness is polled from the runner rather
      # than through a container health check.
      - name: Wait for Keycloak
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/realms/master >/dev/null 2>&1; then
              echo "Keycloak ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Keycloak did not become ready; last 50 log lines:" >&2
          docker logs --tail 50 keycloak >&2
          exit 1

      - name: Federated identity end to end
        env:
          KEYCLOAK_URL: http://localhost:8080
          KEYCLOAK_ADMIN: admin
          KEYCLOAK_ADMIN_PASSWORD: admin
        run: go test ./test/integration/... -run TestKeycloak -race -count=1 -timeout 5m -v

  # The browser end of the same flows the Go integration suite covers from the
  # API end. It is its own job because it needs a built frontend, a running
  # server and a browser — and because it is the slowest thing here, so nothing
  # else should wait on it.
  e2e:
    name: Browser end to end
    runs-on: ubuntu-latest
    needs: [changes, frontend]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      # Chromium only. The suite tests this application's behaviour rather than
      # cross-browser rendering, and three browsers would triple the slowest
      # job in the pipeline to catch bugs it is not looking for.
      - run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Build the server
        run: go build -o bin/server ./cmd/server

      # A real server against a real SQLite database, which is what the suite
      # signs in to. The bootstrap password is required — the server refuses to
      # start without one rather than inventing a credential.
      - name: Start Karakuri
        env:
          KARAKURI_AUTH_JWT_SECRET: e2e-signing-key-not-used-anywhere-else
          KARAKURI_AUTH_BOOTSTRAP_PASSWORD: e2e-bootstrap-password
        run: |
          set -euo pipefail
          mkdir -p /tmp/karakuri-e2e
          KARAKURI_CONFIG=web/e2e/karakuri.e2e.yaml \
            ./bin/server >/tmp/karakuri-e2e/server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null 2>&1; then
              echo "server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server did not become ready; log:" >&2
          cat /tmp/karakuri-e2e/server.log >&2
          exit 1

      - name: Run the browser suite
        env:
          KARAKURI_E2E_URL: http://127.0.0.1:8080
          KARAKURI_AUTH_BOOTSTRAP_PASSWORD: e2e-bootstrap-password
        run: npm run test:e2e
        working-directory: web

      - name: Server log
        if: failure()
        run: cat /tmp/karakuri-e2e/server.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 3
