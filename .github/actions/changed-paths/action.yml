name: Changed paths
description: >-
  Classify a pull request's changed files as documentation-only or not, so the
  expensive jobs can be skipped for prose without being skipped for code.

# Why this exists as a job output rather than a `paths:` filter on the workflow.
#
# `main` is protected and requires status checks. A workflow skipped by a
# top-level `paths` / `paths-ignore` key never creates its checks at all, and
# branch protection leaves them "Expected — waiting for status" forever: the
# documentation pull request the filter was added for becomes permanently
# unmergeable. A job skipped by a job-level `if:` reports success and satisfies
# the requirement. That distinction is the whole design, it is invisible in a
# diff, and collapsing these jobs back into a `paths:` key would block merges
# rather than speed them up.
#
# The classification is an allowlist, not a denylist. CI is skipped only when
# every changed path is recognisably documentation; anything unrecognised runs
# the full matrix. A new top-level directory, a renamed config file or a tool
# nobody has thought of yet therefore fails safe — it runs too much, never too
# little. `.github/**` is tested first and always runs everything, so a pull
# request can never switch CI off for itself, and so `.github/PULL_REQUEST_TEMPLATE.md`
# is not mistaken for prose.
#
# Deliberately not documentation, each because it weakens a gate: .golangci.yml,
# .gitleaks.toml, .trivyignore, .pre-commit-config.yaml, LICENSE, NOTICE. None
# matches the allowlist, so none needs a special case here.

outputs:
  code:
    description: >-
      "true" when the diff touches anything but documentation, and so when the
      full matrix must run. "true" is the fail-safe answer and is what an empty,
      unreadable or non-pull-request diff produces.
    value: ${{ steps.classify.outputs.code }}

runs:
  using: composite
  steps:
    - id: classify
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
      run: |
        set -euo pipefail

        # Only a pull request has a diff to classify. Pushes to main and the
        # weekly scheduled scans always run everything: the push trigger exists
        # so the default branch carries a truthful badge, and a deep re-scan
        # that skipped itself would defeat its own purpose.
        if [ "${EVENT_NAME}" != "pull_request" ]; then
          echo "not a pull request (${EVENT_NAME}) — running everything"
          echo "code=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # actions/checkout builds the pull request's merge ref, whose first
        # parent is the base and whose second is the head — so HEAD^1..HEAD is
        # exactly what this pull request changes, with no second fetch of the
        # base branch. If that ref is not what we expect, say so and run
        # everything rather than guessing.
        if ! files=$(git diff --name-only HEAD^1 HEAD 2>/dev/null); then
          echo "could not diff HEAD^1..HEAD — running everything"
          echo "code=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ -z "${files}" ]; then
          echo "empty diff — running everything"
          echo "code=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "changed files:"
        echo "${files}" | sed 's/^/  /'

        code=false
        while IFS= read -r f; do
          [ -n "$f" ] || continue
          case "$f" in
            # First, so a Markdown file under .github/ is not read as prose and
            # so no pull request can disable its own CI.
            .github/*) code=true ;;
            docs/*)    ;;
            *.md)      ;;
            *)         code=true ;;
          esac
        done <<< "${files}"

        if [ "${code}" = "true" ]; then
          echo "result: not documentation-only — running everything"
        else
          echo "result: documentation-only — skipping the build, test and scan matrix"
        fi
        echo "code=${code}" >> "$GITHUB_OUTPUT"
